[build-system]
requires = ["setuptools>=69", "setuptools-scm>=8", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "media-essentials-library"
dynamic = ["version"]
description = "A terminal UI for media library administration tasks."
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "McDonnough" }]
dependencies = [
    "keyring>=25",
    "packaging>=24",
    "platformdirs>=4.3",
    # Uses a GitHub fork for now. Prefer a PyPI release or a pinned commit/tag before broad release.
    "plexapi @ git+https://github.com/pushingkarmaorg/python-plexapi.git",
    "textual>=0.85",
    "tzdata>=2025.2",
]

[project.optional-dependencies]
dev = [
    "pyinstaller>=6.10",
    "pytest>=8.3",
    "ruff>=0.7",
    "setuptools-scm>=8",
]

[project.scripts]
media-essentials-library = "media_essentials_library.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
media_essentials_library = ["assets/*.txt", "locales/*.json"]

[tool.setuptools_scm]
tag_regex = "^v(?P<version>.*)$"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
pythonpath = ["src"]
