name: Build and Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  build-release:
    name: Build Windows executable and create release
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate release tag
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          if ($tag -notmatch '^v\d+\.\d+\.\d+(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?$') {
            Write-Error "Release tag '$tag' is not a semantic version tag like v1.2.3."
          }

          $pyproject = Get-Content pyproject.toml -Raw
          if ($pyproject -notmatch '(?m)^version\s*=\s*"([^"]+)"') {
            Write-Error "Could not read project version from pyproject.toml."
          }

          $projectVersion = $Matches[1]
          $tagVersion = $tag.Substring(1)
          if ($projectVersion -ne $tagVersion) {
            Write-Error "Tag version '$tagVersion' does not match pyproject.toml version '$projectVersion'."
          }

          "RELEASE_TAG=$tag" >> $env:GITHUB_ENV
          "RELEASE_VERSION=$projectVersion" >> $env:GITHUB_ENV
          "RELEASE_TITLE=Media Essentials Library $tag" >> $env:GITHUB_ENV

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install ".[dev]"

      - name: Build executable
        run: >
          python -m PyInstaller
          .\packaging\media-essentials-library.spec
          --clean
          --noconfirm

      - name: Verify executable exists
        shell: pwsh
        run: |
          $exePath = "dist\media-essentials-library.exe"
          if (-not (Test-Path $exePath)) {
            Write-Error "Expected executable was not created: $exePath"
          }

      - name: Rename release asset
        shell: pwsh
        run: |
          $assetPath = "dist\media-essentials-library-$env:RELEASE_TAG-windows.exe"
          Move-Item "dist\media-essentials-library.exe" $assetPath
          "RELEASE_ASSET=$assetPath" >> $env:GITHUB_ENV

      - name: Upload executable artifact
        uses: actions/upload-artifact@v4
        with:
          name: media-essentials-library-windows
          path: ${{ env.RELEASE_ASSET }}
          if-no-files-found: error

      - name: Create GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create $env:RELEASE_TAG `
            "$env:RELEASE_ASSET" `
            --target "${{ github.sha }}" `
            --title "$env:RELEASE_TITLE" `
            --notes "Automated Windows build for $env:RELEASE_TAG from commit ${{ github.sha }}."
